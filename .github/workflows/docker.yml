# -----------------------------------------------------------------------------
# Pipeline : sing-box Cloud Run container validation and delivery
# Purpose  : Validate workflow, Dockerfile, strict JSON, and sing-box config.
#            Build a local test image before authenticating and pushing.
# Triggers : Push to main/update branches; pull requests targeting main.
# Secrets  : DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (main push only)
# -----------------------------------------------------------------------------

name: Build and Push Docker Image

on:
  push:
    branches: [main, "update/**", "chore/**"]
  pull_request:
    branches: [main]

# Keep repository access read-only; grant only the permissions needed by checks.
permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Catch workflow syntax and common GitHub Actions mistakes.
      - name: Validate GitHub Actions workflow
        uses: reviewdog/action-actionlint@v1.73.4
        with:
          fail_level: error
          reporter: github-check

      # Run BuildKit's static Dockerfile checks before executing the build.
      - name: Validate Dockerfile
        uses: docker/setup-buildx-action@v3

      - name: Run Dockerfile build checks
        run: docker buildx build --check --build-arg BUILDKIT_DOCKERFILE_CHECK=error=true .

      # config.json is strict JSON; do not strip or allow JSONC comments.
      - name: Validate JSON syntax
        run: jq -e . config.json > /dev/null

      # Validate the configuration with the exact sing-box version used by the image.
      - name: Validate sing-box configuration
        run: |
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz" -o /tmp/sing-box.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          /tmp/sing-box-1.14.4-linux-amd64/sing-box check -c config.json

      # Execute the complete Dockerfile build without pushing or using registry secrets.
      # This catches download, extraction, COPY, and image assembly failures early.
      - name: Test Docker image build
        run: docker build --tag singbox-5s:validation --file ./Dockerfile .

  build:
    needs: validate
    # Publish only after validation succeeds on a push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Registry credentials are used only in the publishing job.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Publish the validated image as the latest tag.
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/singbox-5s:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
